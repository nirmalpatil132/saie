<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saie Jadhav</title>
    <script>
      // Single Page Apps for GitHub Pages — redirects deep links (e.g.
      // /saie/projects/bizhub) through the query string so index.html can
      // restore the real route on load. See index.html for the counterpart.
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
